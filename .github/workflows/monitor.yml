name: Social Media Monitor

on:
  schedule:
    # Runs at 10:15 AM IST (04:45 UTC) and 8:15 PM IST (14:45 UTC)
    # (Runs 15 minutes after the news script)
    - cron: "45 4,14 * * *"
  workflow_dispatch: {}   # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write   # Required to commit state.json updates back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run social media monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 social_monitor.py

      - name: Commit updated state
        run: |
          git config user.name "social-monitor-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || (git pull --rebase && git commit -m "Update seen-posts state [skip ci]" && git push)
